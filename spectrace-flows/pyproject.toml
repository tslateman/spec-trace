[project]
name = "spectrace-flows"
version = "0.1.0"
description = "Verification flow engine for SpectTRACE - execute sequential verification flows with pluggable storage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
django = ["django>=4.2"]
dev = [
    "pytest>=7.0",
    "pytest-randomly>=3.0",
    "freezegun>=1.2",
    "responses>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spectrace_flows"]

[project.scripts]
spectrace-flows = "spectrace_flows.cli:main"
