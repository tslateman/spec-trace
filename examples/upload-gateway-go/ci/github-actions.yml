# Push the Go example's links and results to SpecTrace on every change.
#
# Copy this into .github/workflows/ and set SPECTRACE_URL and SPECTRACE_API_KEY
# as repository secrets.

name: Upload Gateway Traceability

on:
  pull_request:
  push:
    branches: [main]

jobs:
  trace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/upload-gateway-go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.1

      # continue-on-error keeps a red suite pushing its results; SpecTrace is
      # where the failure shows up as an unverified requirement.
      - name: Run the suite for its JUnit report
        continue-on-error: true
        run: gotestsum --junitfile junit.xml --format testname ./...

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the SpecTrace CLI
        run: pip install spectrace

      - name: Push the specs and the links the test names carry
        run: spectrace push --specs specs --links junit.xml --replace
        env:
          SPECTRACE_URL: ${{ secrets.SPECTRACE_URL }}
          SPECTRACE_API_KEY: ${{ secrets.SPECTRACE_API_KEY }}

      - name: Push the results
        run: spectrace results push junit.xml
        env:
          SPECTRACE_URL: ${{ secrets.SPECTRACE_URL }}
          SPECTRACE_API_KEY: ${{ secrets.SPECTRACE_API_KEY }}
