openapi: 3.0.3
info:
  title: SpecTrace Worker API
  version: 1.0.0
  description: |-
    The v1 contract the Cloudflare Worker implements. Every path under `/api/v1/` survives from the Django server with its schemas intact, minus the Linear and GitHub webhook integrations. Five endpoints are new: the CLI pushes the requirement tree (`PUT /api/v1/specs/`), impact reports (`POST /api/v1/results/impact/`), and drift reports (`POST /api/v1/results/drift/`); `spectrace lore sync` drains the task outbox (`GET /api/v1/tasks/outcomes`, `POST /api/v1/tasks/outcomes/ack`). `GET /api/v1/specs/impact/` and `GET /api/v1/specs/drift/` serve the last pushed report instead of computing one; their response shapes stay.

    The Worker enforces the API key on every route: send it in the `X-API-Key` header. A missing or wrong key returns 401 with an `ErrorEnvelope`.

    Two error shapes exist. Routes that moved from `api.py` keep the legacy `ErrorResponse` (`{"success": false, "error": "..."}`); every other route returns `ErrorEnvelope` (`{"error": {"code", "message", "details"}}`). Success bodies on those routes wrap the payload as `{"data": ..., "meta": ...}` with `meta` present only when the route paginates.
servers:
- url: /
security:
- apiKey: []
tags:
- name: Specs
  description: The contract surface. The CLI writes it, agents and screens read it.
- name: Tasks
  description: The agent surface. Claims, leases, reviews, and the Lore outbox.
- name: Results
  description: The evidence surface. CI and the CLI push, screens read.
- name: Flows
- name: Verification
- name: Verification Runs
- name: Test Runs
- name: SLO
paths:
  /api/v1/specs/:
    get:
      tags:
      - Specs
      summary: Page one project's requirements in tree order
      description: |-
        Lists requirements ordered by materialized path, so parents precede their children. `parent_id` narrows the page to that requirement's descendants; naming a requirement the store lacks returns an empty page rather than an error. `tags` takes a comma-separated list and matches a requirement carrying any of them. `status`, `verification_status`, and `risk_level` each match one value exactly. `max_depth` limits how deep below the scope the page reaches: `1` returns the roots, or the direct children of `parent_id`. Every row carries a `descendants` rollup counting its whole subtree by verification status, with the highest risk level found there, so a collapsed parent still shows what lies beneath it. `attention=1` keeps only requirements that are not passing or that carry high or critical risk. When `parent_id` names a stored requirement, `data.scope` carries it with its ancestors, root first, for breadcrumbs.
      operationId: api-v1-specs_get
      parameters:
      - $ref: '#/components/parameters/ProjectParam'
      - name: status
        in: query
        description: Lifecycle status, matched exactly
        schema:
          type: string
      - name: verification_status
        in: query
        schema:
          $ref: '#/components/schemas/VerificationStatus'
      - name: risk_level
        in: query
        schema:
          $ref: '#/components/schemas/RiskLevel'
      - name: tags
        in: query
        description: Comma-separated tags; a requirement carrying any of them matches
        schema:
          type: string
      - name: parent_id
        in: query
        description: External id whose descendants make up the page
        schema:
          type: string
      - name: max_depth
        in: query
        description: Levels below the scope to include; 1 returns the roots, or the direct children of `parent_id`
        schema:
          type: integer
          minimum: 1
      - name: attention
        in: query
        description: '`1` keeps only requirements that are not passing or that carry high or critical risk'
        schema:
          type: string
          enum:
          - '1'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: One page of requirements
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/RequirementPage'
                  meta:
                    $ref: '#/components/schemas/PagePosition'
        '400':
          description: Ambiguous project; `details.projects` lists the candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Specs
      summary: Replace one project's requirement tree, test links, and flows
      description: |-
        Bulk upsert from `spectrace push`. With `replace` the payload is the whole project: requirements the store holds for `project` but the payload omits are deleted, as are their test links and the flows the payload omits; without it, omitted rows stay. Requirements key on `external_id`, links on `(test_nodeid, requirement_id)`, flows on `name`. The tree is rebuilt from `parent_id`, siblings ordered by `external_id`, so a requirement whose parent changed moves. References in `parent_id`, `depends_on`, `links[].requirement_id`, and `flows[].requirements` resolve against the payload first and then against stored requirements of other projects; a reference that resolves nowhere is dropped and listed in `unresolved`. `verification_status`, `slo_status`, and `structure_completeness` are computed by the Worker and not accepted.
      operationId: api-v1-specs_put
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecPushRequest'
      responses:
        '200':
          description: Counts per kind after the store matches the payload
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SpecPushResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/slos/:
    put:
      tags:
      - Integrations
      summary: Upsert SLO definitions and relink them to requirements
      description: |-
        Bulk upsert from `spectrace push --slos`, which parses OpenSLO documents from disk. SLOs key on `name`. Each SLO's `requirement_ids` replace its links outright, so dropping an id unlinks it; an id matching no stored requirement is dropped and listed in `unresolved`. `status`, `current_value`, `error_budget_remaining`, and `last_updated` belong to observability platforms through `POST /api/v1/integrations/slo/status/` and are never written here: a new SLO starts at `not_linked` and an existing one keeps what it holds. Each requirement's `slo_status` is recomputed afterwards, so linking one here changes the matrix without a status push.
      operationId: api-v1-slos_put
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SloPushRequest'
      responses:
        '200':
          description: Counts of SLOs written, with the requirement ids that matched nothing
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SloPushResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/specs/coverage/:
    get:
      tags:
      - Specs
      summary: Coverage metrics and stale requirements for one project
      description: |-
        Counts requirements by verification status. `stale_requirements` are the requirement ids named by `stale_link` errors and `spec_drift` warnings in the last drift report pushed for the project, intersected with the project's requirements; without a stored report the list is empty.
      operationId: api-v1-specs-coverage_get
      parameters:
      - $ref: '#/components/parameters/ProjectParam'
      responses:
        '200':
          description: Coverage report
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CoverageReport'
        '400':
          description: Ambiguous project; `details.projects` lists the candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/specs/coverage/trend:
    get:
      tags:
      - Specs
      summary: The coverage snapshot series for one project
      description: |-
        Serves the snapshots `POST /api/v1/results/coverage/` stored, oldest first, so a chart reads left to right. `limit` keeps the most recent runs. The Worker computes nothing here; `spectrace specs coverage --push` measures the checkout and sends the numbers.
      operationId: api-v1-specs-coverage-trend_get
      parameters:
      - $ref: '#/components/parameters/ProjectParam'
      - name: limit
        in: query
        description: Most recent snapshots to return (default 100, max 500)
        schema:
          type: integer
          default: 100
          maximum: 500
      responses:
        '200':
          description: Coverage trend
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CoverageTrend'
        '400':
          description: Ambiguous project; `details.projects` lists the candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/specs/drift/:
    get:
      tags:
      - Specs
      summary: The last pushed drift report
      description: |-
        Serves the report most recently stored by `POST /api/v1/results/drift/` for the project. The Worker computes nothing here; `spectrace drift --push` runs detection where the repo lives. Response shape unchanged from the Django server, plus `stored_at`.
      operationId: api-v1-specs-drift_get
      parameters:
      - $ref: '#/components/parameters/ProjectParam'
      responses:
        '200':
          description: Drift report
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StoredDriftReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No drift report has been pushed for the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/specs/impact/:
    get:
      tags:
      - Specs
      summary: The last pushed impact report
      description: |-
        Serves the report most recently stored by `POST /api/v1/results/impact/` for the project. The Worker computes nothing here; `spectrace impact --push` runs the analysis against git where the repo lives. The `spec_id` and `file_path` query parameters are gone with the computation. Response shape unchanged from the Django server, plus the report's `base`, `head`, `generated_at`, `stored_at`, and optional `code` block.
      operationId: api-v1-specs-impact_get
      parameters:
      - $ref: '#/components/parameters/ProjectParam'
      responses:
        '200':
          description: Impact report
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StoredImpactReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No impact report has been pushed for the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/specs/{external_id}/context:
    get:
      tags:
      - Specs
      summary: Surrounding context for one requirement
      description: |-
        The requirement with its test links, dependencies, dependents, and FRET fields. No trailing slash.
      operationId: api-v1-specs-context_get
      parameters:
      - $ref: '#/components/parameters/ExternalIdParam'
      responses:
        '200':
          description: Requirement context
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SpecContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/specs/{external_id}/status/:
    get:
      tags:
      - Specs
      summary: Verification status for one requirement
      operationId: api-v1-specs-status_get
      parameters:
      - $ref: '#/components/parameters/ExternalIdParam'
      responses:
        '200':
          description: Requirement status
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SpecStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tasks/:
    get:
      tags:
      - Tasks
      summary: List agent tasks
      operationId: api-v1-tasks-list_get
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      - name: status
        in: query
        description: Exact match on task status
        schema:
          $ref: '#/components/schemas/TaskStatus'
      - name: sort
        in: query
        description: Comma-separated AgentTask fields; `-` prefix sorts descending. Unknown fields are
          ignored.
        schema:
          type: string
          default: -created_at
          example: -priority,title
      responses:
        '200':
          description: A page of tasks
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskSummary'
                  meta:
                    $ref: '#/components/schemas/PagePosition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Tasks
      summary: Create a draft task
      description: |-
        Records a task in `draft` with its requirements, scope, and falsifiable `done_when` criteria. Only PLANNER agents create tasks. The task stays in `draft` until a reviewer approves its spec through `approve-spec`.
      operationId: api-v1-tasks-create_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Draft task created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TaskDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionRejected'
  /api/v1/tasks/agents/register/:
    post:
      tags:
      - Tasks
      summary: Register or update an agent
      description: |-
        Creates the agent or updates its role and marks it active. Carried from the Django `agent_register` command.
      operationId: api-v1-tasks-agents-register_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '200':
          description: Agent registered
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tasks/flow-runs/running/:
    get:
      tags:
      - Flows
      summary: Get running flow runs
      description: Get currently running flow runs for live monitoring.
      operationId: api-v1-tasks-flow-runs-running_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunningFlowRunsResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': &id001
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/outcomes:
    get:
      tags:
      - Tasks
      summary: Read the Lore outbox
      description: |-
        Terminal task outcomes (`merged`, `abandoned`) in the order they happened, for `spectrace lore sync`. Each outcome carries an opaque, monotonically increasing `cursor`. Pass the last cursor you processed as `since` to read what follows it; without `since`, the page starts after the last acknowledged cursor. Outcomes stay readable after acknowledgement, marked `drained`. No trailing slash.
      operationId: api-v1-tasks-outcomes_get
      parameters:
      - name: since
        in: query
        description: Cursor of the last outcome already processed; exclusive
        schema:
          type: string
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of outcomes, oldest first
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskOutcome'
                  meta:
                    $ref: '#/components/schemas/CursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tasks/outcomes/ack:
    post:
      tags:
      - Tasks
      summary: Mark outcomes drained
      description: |-
        Marks every outcome with a cursor at or before `cursor` as drained. Idempotent. No trailing slash.
      operationId: api-v1-tasks-outcomes-ack_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomesAckRequest'
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OutcomesAckResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tasks/{task_id}:
    get:
      tags:
      - Tasks
      summary: Read one task's ledger row
      description: |-
        The task as the ledger holds it: status, claim, `done_when`, scope, and the git facts `branch`, `commit_sha`, and `merge_sha`. `spectrace tasks merge` reads this before it touches git, because the drift check compares the task branch's tip against the commit the review read. `GET /api/v1/tasks/{task_id}/context` serves the requirement bundle instead. No trailing slash.
      operationId: api-v1-tasks-detail_get
      parameters:
      - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: The task's ledger row
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tasks/{task_id}/context:
    get:
      tags:
      - Tasks
      summary: Assemble a task's context bundle
      description: |-
        The bundle an agent reads before it starts work: the task with its `done_when`, scope, and spec reference, every linked requirement with its FRET fields, tree placement, and test results, and live drift over the whole database. Carried from the Django `agent_context` command. The Worker has no subprocess, so the Lore overlay and the markdown rendering stay in the CLI. No trailing slash.
      operationId: api-v1-tasks-context_get
      parameters:
      - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: The task's context bundle
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TaskContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tasks/{task_id}/approve-spec:
    post:
      tags:
      - Tasks
      summary: Approve a draft task's spec
      description: |-
        The spec-review gate. A REVIEWER agent approves the spec and the task moves from `draft` to `unclaimed`; the approval lands in the task history as `SPEC_APPROVED` with the reviewer and feedback. Refused with `SPEC_INCOMPLETE` when the task names no requirements, no `scope_in`, or no `done_when` criteria, and with `NOT_DRAFT` when the task has already left `draft`. No trailing slash.
      operationId: api-v1-tasks-approve-spec_post
      parameters:
      - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveSpecRequest'
      responses:
        '200':
          description: Spec approved
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/TransitionResult'
                    - type: object
                      required:
                      - reviewer_id
                      properties:
                        reviewer_id:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionRejected'
  /api/v1/tasks/{task_id}/reject-spec:
    post:
      tags:
      - Tasks
      summary: Reject a draft task's spec
      description: |-
        The other half of the spec-review gate. A REVIEWER agent rejects the spec and the task moves from `draft` to `abandoned`; the rejection lands in the task history as `SPEC_REJECTED` with the reviewer and the reason, and in the Lore outbox as an abandoned outcome. `reason` is required, so a rejected draft always carries why. Refused with `NOT_DRAFT` when the task has already left `draft`. No trailing slash.
      operationId: api-v1-tasks-reject-spec_post
      parameters:
      - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectSpecRequest'
      responses:
        '200':
          description: Spec rejected
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/TransitionResult'
                    - type: object
                      required:
                      - reviewer_id
                      - reason
                      properties:
                        reviewer_id:
                          type: string
                        reason:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionRejected'
  /api/v1/tasks/{task_id}/intent-validations:
    post:
      tags:
      - Tasks
      summary: Record an intent validation for a commit
      description: |-
        Records the verdict of an intent evaluation of one commit on the task. `validator_id` names the agent that judged; the Worker refuses the agent holding the task's claim with `SELF_INTENT_NOT_ALLOWED`, so a coder cannot score its own commit. `passed` defaults to every score reaching 70, the same threshold as the Django `validate_intent` command. `complete` and `submit` refuse a commit whose latest validation is missing (`INTENT_NOT_VALIDATED`) or failed (`INTENT_FAILED`). No trailing slash.
      operationId: api-v1-tasks-intent-validations_post
      parameters:
      - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentValidationRequest'
      responses:
        '201':
          description: Intent validation recorded
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/IntentValidation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionRejected'
  /api/v1/tasks/{task_id}/claim:
    post:
      tags:
      - Tasks
      summary: Claim a task and take a lease
      description: |-
        Moves an unclaimed task to `claimed`. The TaskLedger serializes concurrent claims, so exactly one caller wins. No trailing slash.
      operationId: api-v1-tasks-claim_post
      parameters:
      - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Task claimed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/TransitionResult'
                    - type: object
                      required:
                      - lease_expires
                      - agent_id
                      properties:
                        lease_expires:
                          type: string
                          format: date-time
                        agent_id:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
