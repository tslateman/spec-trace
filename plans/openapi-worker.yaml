  /api/v1/tasks/{task_id}/review:
    post:
      tags:
      - Tasks
      summary: Review a submitted task
      description: |-
        Records a review. `approved` moves the task to `approved`. `changes_requested` moves it to `changes_requested` and counts an attempt; when `attempt_count` reaches `max_attempts` the task moves to `abandoned` instead, which appends an outcome to the Lore outbox. `rejected` targets `abandoned`, but the state machine has no `ready_for_review` to `abandoned` edge, so it is refused with `INVALID_TRANSITION`, as in Django. No trailing slash.
      operationId: api-v1-tasks-review_post
      parameters:
      - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TransitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionRejected'
  /api/v1/tasks/{task_id}/merge:
    post:
      tags:
      - Tasks
      summary: Record the merge of an approved task
      description: |-
        Records a merge that already happened in git: moves the task from `approved` to `merged`, stores `merge_sha` on the task, and appends an outcome to the Lore outbox. Refused with `BRANCH_DRIFTED` when `branch_head_sha` differs from the commit the review read, so a branch that moved since review cannot be recorded as merged. `spectrace tasks merge` runs the git merge and posts the result. No trailing slash.
      operationId: api-v1-tasks-merge_post
      parameters:
      - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: Task merged
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/TransitionResult'
                    - type: object
                      required:
                      - merge_sha
                      - branch
                      properties:
                        merge_sha:
                          type: string
                        branch:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionRejected'
