      description: |-
        What the task's linked tests did at the commit its coder submitted. `passing` means every linked requirement has at least one result at that commit and none of them failed; `missing` means a requirement has no result there; `failing` means one failed. `approve` refuses any task whose summary is not `passing`.
      type: object
      required:
      - commit_sha
      - status
      - run_ids
      - imported_at
      - passed
      - failed
      - requirements
      properties:
        commit_sha:
          type: string
        status:
          type: string
          enum:
          - passing
          - failing
          - missing
        run_ids:
          type: array
          items:
            type: integer
        imported_at:
          type: string
          format: date-time
          nullable: true
        passed:
          type: integer
        failed:
          type: integer
        requirements:
          type: array
          items:
            type: object
            required:
            - requirement_id
            - passed
            - failed
            properties:
              requirement_id:
                type: string
              passed:
                type: integer
              failed:
                type: integer
