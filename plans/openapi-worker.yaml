  /api/v1/results/merge-safety:
    get:
      tags:
      - Results
      summary: Composed merge-safety view
      description: |-
        Composes the latest impact report, latest drift report, and unresolved conflicts into one verdict: `blocked` if any unresolved conflict has `high` confidence or drift has errors; `needs_review` if any unresolved conflict exists, drift has warnings, or impact risk is `high`/`critical`; otherwise `safe`. `impact` and `drift` are `null` when no report has been pushed yet.
      operationId: api-v1-results-merge-safety_get
      parameters:
      - name: project
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Merge-safety summary
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - generated_at
                    - verdict
                    - impact
                    - drift
                    - conflicts
                    properties:
                      generated_at:
                        type: string
                        format: date-time
                      verdict:
                        type: string
                        enum: [safe, needs_review, blocked]
                      impact:
                        nullable: true
                        type: object
                      drift:
                        nullable: true
                        type: object
                      conflicts:
                        type: object
                        required:
                        - open_count
                        - items
                        properties:
                          open_count:
                            type: integer
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ConflictSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/flows/runs/:
    post:
      tags:
      - Flows
      summary: Record one execution of a stored flow
      description: |-
        Written by `spectrace flows run`, which executes the flow where the repository is checked out and posts what happened. The flow must already be stored, which `spectrace push --flows` does; a run naming a flow the store lacks is refused rather than orphaned. Steps are stored in `step_order`, and the run keeps the timestamps the runner observed rather than the ones the Worker assigns, so a replayed run reads as when it ran.
      operationId: api-v1-flows-runs_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowRunRecord'
      responses:
        '201':
          description: The stored run
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/FlowRunPushResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/corpus/entries/:
    put:
      tags:
      - Corpus
      summary: Upsert corpus entries and record versions the store lacks
      description: |-
        Bulk upsert from `spectrace push --corpus`, which parses the corpus directory from disk. Entries key on `external_id`; versions key on `(entry, version)` and are immutable. Re-pushing a version whose `content_hash` differs from the stored one is refused, not overwritten: bump `version` to record new content. A version that drops a check id its predecessor defined is refused unless the document accounts for it, with `renamed_from` on the replacing check or the id under `retired_checks`, because a finding cites `ENTRY-ID#check-id` with no version in it. `supersedes` resolves against the payload first and then the store, and names a version that must exist. Snapshots are not written here; a snapshot records the versions a review ran against, so the Worker captures it when a review is stored.
      operationId: api-v1-corpus-entries_put
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpusPushRequest'
      responses:
        '200':
          description: Counts of entries and versions written
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CorpusPushResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/corpus/reviews/:
    get:
      tags:
      - Corpus
      summary: List spec reviews
      operationId: api-v1-corpus-reviews_get
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      - name: outcome
        in: query
        schema:
          type: string
      - name: reviewer
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A page of spec reviews, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SpecReviewSummary'
                  meta:
                    $ref: '#/components/schemas/PagePosition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/corpus/reviews/{review_id}/:
    get:
      tags:
      - Corpus
      summary: Spec review detail
      operationId: api-v1-corpus-review-detail_get
      parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Spec review with coverage and findings
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SpecReviewDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/integrations/slo/status/:
    get:
      tags:
      - SLO
      summary: List SLO status
      operationId: api-v1-integrations-slo-status_get
      responses:
        '200':
          description: All SLOs and their linked requirements
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SLOStatusSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - SLO
      summary: Update SLO status
      description: Update SLO status from observability platform.
      operationId: api-v1-integrations-slo-status_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLOStatusRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLOStatusResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': *id001
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: The `SPECTRACE_API_KEY` Worker secret. Required on every route.
  parameters:
    ProjectParam:
      name: project
      in: query
      description: Project name; defaults to the deployment's `SPECTRACE_PROJECT`
      schema:
        type: string
    ExternalIdParam:
      name: external_id
      in: path
      required: true
      schema:
        type: string
    TaskIdParam:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    RunIdParam:
      name: run_id
      in: path
      required: true
      schema:
        type: integer
    ConflictIdParam:
      name: conflict_id
      in: path
      required: true
      schema:
        type: integer
    LimitParam:
      name: limit
      in: query
      description: Page size (default 50, max 100)
      schema:
        type: integer
        default: 50
        maximum: 100
    PageParam:
      name: page
      in: query
      description: 1-based page number; a page past the last returns the last page
      schema:
        type: integer
        default: 1
        minimum: 1
    PerPageParam:
      name: per_page
      in: query
      description: Page size (max 100). A non-integer value is a 400.
      schema:
        type: integer
        default: 25
        maximum: 100
  responses:
    Unauthorized:
      description: Missing or wrong `X-API-Key`; `code` is `unauthorized`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Malformed JSON, missing field, or invalid query parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: No such resource; `code` is `not_found`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TransitionRejected:
      description: |-
        The ledger refused the transition. `code` is `transition_error` and `details.reason` carries the ledger's reason in upper case: `AGENT_INACTIVE`, `AGENT_BUSY`, `ROLE_NOT_ALLOWED`, `NOT_OWNER`, `NOT_APPROVED`, `NOT_DRAFT`, `SPEC_INCOMPLETE`, `INTENT_NOT_VALIDATED`, `INTENT_FAILED`, `SELF_INTENT_NOT_ALLOWED`, `DEPENDENCIES_NOT_MET`, `INVALID_TRANSITION`. Creating a task that already exists is a 409 with `code` `conflict` and `details.reason` `TASK_EXISTS`. An unknown task or agent (`TASK_NOT_FOUND`, `AGENT_NOT_FOUND`) is a 404 instead, with the same `details.reason`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    CursorPage:
      type: object
      required:
      - limit
      - next_cursor
      properties:
        limit:
          type: integer
        next_cursor:
          type: string
          nullable: true
          description: Pass as `since` to read the next page; null when this page is the last
    RiskLevel:
      type: string
      enum:
      - unclassified
      - low
      - medium
      - high
      - critical
    VerificationMethod:
      type: string
      enum:
      - unspecified
      - test
      - inapp
      - both
    VerificationStatus:
      type: string
      enum:
      - untested
      - passing
      - failing
    TaskStatus:
      type: string
      enum:
      - draft
      - unclaimed
      - claimed
      - in_progress
      - ready_for_review
      - changes_requested
      - approved
      - merged
      - blocked
      - abandoned
    AgentRole:
      type: string
      enum:
      - planner
      - coder
      - reviewer
    ConflictConfidence:
      type: string
      enum:
      - high
      - medium
      - low
    SpecPushRequest:
      type: object
      required:
      - project
      - requirements
      - links
      - flows
      properties:
        project:
          type: string
          minLength: 1
        replace:
          type: boolean
          default: false
          description: Delete the project's stored requirements, their test links, and the flows the payload omits
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/RequirementUpsert'
        links:
          type: array
          items:
            $ref: '#/components/schemas/TestLinkUpsert'
        flows:
          type: array
          items:
            $ref: '#/components/schemas/FlowUpsert'
    RequirementUpsert:
      description: |-
        One requirement as `SpecParser.parse_directory` yields it. The tree is flat; `parent_id` names the parent.
      type: object
      required:
      - external_id
      - title
      - source_file
      properties:
        external_id:
          type: string
          maxLength: 50
        title:
          type: string
          maxLength: 200
        description:
          type: string
          default: ''
        tags:
          type: array
          items:
            type: string
          default: []
        priority:
          type: string
          maxLength: 20
          default: ''
        status:
          type: string
          maxLength: 20
          default: draft
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        parent_id:
          type: string
          nullable: true
          description: The parent's `external_id`; null for a root
        source_file:
          type: string
          maxLength: 500
        verification_method:
          $ref: '#/components/schemas/VerificationMethod'
        scope:
          type: string
          default: ''
        condition:
          type: string
          default: ''
        component:
          type: string
          maxLength: 255
          default: ''
        timing:
          type: string
          maxLength: 100
          default: ''
        response:
          type: string
          default: ''
        depends_on:
          type: array
          description: Requirement ids this one depends on; may name requirements in other projects
          items:
            type: string
          default: []
    TestLinkUpsert:
      description: One entry of `.spectrace/links.json` as `extract_links` writes it.
      type: object
      required:
      - test_nodeid
      - requirement_id
      properties:
        test_nodeid:
          type: string
          maxLength: 500
        requirement_id:
          type: string
    FlowUpsert:
      description: One flow YAML document as `YAMLFlowParser` reads it.
      type: object
      required:
      - name
      - display_name
      - steps
      properties:
        name:
          type: string
          maxLength: 100
          description: The YAML `id`
        display_name:
          type: string
          maxLength: 200
          description: The YAML `title`
        description:
          type: string
          default: ''
        version:
          type: integer
          default: 1
        source_file:
          type: string
          default: ''
        requirements:
          type: array
          items:
            type: string
          default: []
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FlowStepDefinition'
    FlowStepDefinition:
      type: object
      required:
      - name
      - display_name
      properties:
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
          default: ''
        type:
          type: string
          enum:
          - handler
          - api_call
          - assertion
          - wait
          default: handler
        handler:
          type: string
          description: Dotted path; required when `type` is `handler`
          default: ''
        config:
          type: object
          additionalProperties: true
          default: {}
    FlowRunRecord:
      type: object
      required:
      - flow_name
      - status
      - source
      - started_at
      - steps
      properties:
        flow_name:
          type: string
        status:
          type: string
        source:
          type: string
        context:
          type: object
        started_at:
          type: string
        completed_at:
          type: string
          nullable: true
        steps:
          type: array
          items:
            type: object
            required:
            - step_order
            - name
            - passed
            - started_at
            - completed_at
            properties:
              step_order:
                type: integer
              name:
                type: string
              passed:
                type: boolean
              details:
                type: string
              error_message:
                type: string
              response_status:
                type: integer
                nullable: true
              response_body:
                type: string
              started_at:
                type: string
              completed_at:
                type: string
    FlowRunPushResult:
      type: object
      required:
      - run_id
      - flow
      - status
      - steps
      properties:
        run_id:
          type: integer
        flow:
          type: string
        status:
          type: string
        steps:
          type: integer
    UpsertCounts:
      type: object
      required:
      - created
      - updated
      - deleted
      properties:
        created:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
    SloPushRequest:
      type: object
      required:
      - slos
      properties:
        slos:
          type: array
          items:
            type: object
            required:
            - name
            - source_file
            properties:
              name:
                type: string
              display_name:
                type: string
              description:
                type: string
              service:
                type: string
              target:
                type: number
                nullable: true
              time_window:
                type: string
              budgeting_method:
                type: string
              source_file:
                type: string
              requirement_ids:
                type: array
                items:
                  type: string
    SloPushResult:
      type: object
      required:
      - created
      - updated
      - unresolved
      properties:
        created:
          type: integer
        updated:
          type: integer
        unresolved:
          type: array
          items:
            type: string
    CorpusPushRequest:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            type: object
            required:
            - external_id
            - version
            - content_hash
            - checks
            - source_file
            properties:
              external_id:
                type: string
              kind:
                type: string
              title:
                type: string
              owner:
                type: string
              status:
                type: string
              version:
                type: integer
              body:
                type: string
              content_hash:
                type: string
              applies_to:
                type: object
              checks:
                type: array
                items:
                  type: object
              retired_checks:
                type: array
                items:
                  type: string
              enforcement:
                type: string
              effective_date:
                type: string
                nullable: true
              supersedes:
                type: string
                nullable: true
              source_file:
                type: string
    CorpusPushResult:
      type: object
      required:
      - entries_created
      - versions_created
      - versions_unchanged
      properties:
        entries_created:
          type: integer
        versions_created:
          type: integer
        versions_unchanged:
          type: integer
    SpecPushResult:
      type: object
      required:
      - project
      - requirements
      - links
      - flows
      - unresolved
      properties:
        project:
          type: string
        requirements:
          $ref: '#/components/schemas/UpsertCounts'
        links:
          $ref: '#/components/schemas/UpsertCounts'
        flows:
          $ref: '#/components/schemas/UpsertCounts'
        unresolved:
          type: array
          description: References dropped because they name no requirement in the payload or the store
          items:
            type: object
            required:
            - kind
            - source
            - ref
            properties:
              kind:
                type: string
                enum:
                - parent_id
                - depends_on
                - link
                - flow
              source:
                type: string
                description: The requirement, test nodeid, or flow name holding the reference
              ref:
                type: string
                description: The requirement id that resolved nowhere
    RequirementPage:
      type: object
      required:
      - project
      - requirements
      properties:
        project:
          type: string
        scope:
          $ref: '#/components/schemas/RequirementScope'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/RequirementSummary'
    RequirementScope:
      type: object
      description: The `parent_id` requirement and its ancestors, root first; present only when `parent_id` names a stored requirement
      required:
      - external_id
      - title
      - ancestors
      properties:
        external_id:
          type: string
        title:
          type: string
        ancestors:
          type: array
          items:
            type: object
            required:
            - external_id
            - title
            properties:
              external_id:
                type: string
              title:
                type: string
    RequirementSummary:
      type: object
      required:
      - external_id
      - title
      - description
      - path
      - depth
      - numchild
      - tags
      - priority
      - status
      - verification_status
      - verification_method
      - risk_level
      - source_file
      - descendants
      properties:
        external_id:
          type: string
        title:
          type: string
        description:
          type: string
        path:
          type: string
          description: Materialized path; sorting by it yields tree order
        depth:
          type: integer
        numchild:
          type: integer
        tags:
          type: array
          items:
            type: string
        priority:
          type: string
        status:
          type: string
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        verification_method:
          $ref: '#/components/schemas/VerificationMethod'
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        source_file:
          type: string
        descendants:
          $ref: '#/components/schemas/DescendantRollup'
    DescendantRollup:
      type: object
      description: Counts over a requirement's whole subtree, excluding the requirement itself; all zero for a leaf
      required:
      - total
      - passing
      - failing
      - untested
      - highest_risk
      properties:
        total:
          type: integer
        passing:
          type: integer
        failing:
          type: integer
        untested:
          type: integer
        highest_risk:
          $ref: '#/components/schemas/RiskLevel'
    PagePosition:
      type: object
      required:
      - page
      - per_page
      - total
      - total_pages
      - has_next
      - has_prev
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
    CoverageReport:
      type: object
      required:
      - project
      - metrics
      - stale_requirements
      properties:
        project:
          type: string
        metrics:
          type: object
          required:
          - total
          - non_draft
          - passing
          - failing
          - untested
          - stale
          properties:
            total:
              type: integer
            non_draft:
              type: integer
            passing:
              type: integer
            failing:
              type: integer
            untested:
              type: integer
            stale:
              type: integer
        stale_requirements:
          type: array
          items:
            type: string
    CoverageMeasurement:
      description: What one `spectrace specs coverage` run measured, and the commit it measured.
      type: object
      required:
      - commit_sha
      - git_branch
      - generated_at
      - specification_rate
      - structure_rate
      - verification_rate
      - total
      - non_draft
      - passing
      properties:
        commit_sha:
          type: string
          description: HEAD of the checkout the run measured
        git_branch:
          type: string
          description: Branch the run measured; `HEAD` on a detached checkout
        generated_at:
          type: string
          format: date-time
        specification_rate:
          type: number
          description: Non-draft requirements over total, 0 to 1
        structure_rate:
          type: number
          description: Mean FRET completeness, 0 to 1
        verification_rate:
          type: number
          description: Passing requirements over total, 0 to 1
        total:
          type: integer
        non_draft:
          type: integer
        passing:
          type: integer
    CoverageSnapshot:
      type: object
      allOf:
      - $ref: '#/components/schemas/CoverageMeasurement'
      - type: object
        required:
        - stored_at
        properties:
          stored_at:
            type: string
            format: date-time
    CoverageSnapshotPush:
      type: object
      allOf:
      - $ref: '#/components/schemas/CoverageMeasurement'
      - type: object
        required:
        - project
        properties:
          project:
            type: string
    CoverageTrend:
      type: object
      required:
      - project
      - snapshots
      properties:
        project:
          type: string
        snapshots:
          type: array
          description: Oldest first
          items:
            $ref: '#/components/schemas/CoverageSnapshot'
    StoredCoverageSnapshotReceipt:
      type: object
      allOf:
      - $ref: '#/components/schemas/StoredReportReceipt'
      - type: object
        required:
        - previous
        properties:
          previous:
            type: object
            description: The snapshot stored before this one; null on the project's first run
            allOf:
            - $ref: '#/components/schemas/CoverageSnapshot'
            nullable: true
    SpecContext:
      type: object
      required:
      - external_id
      - title
      - description
      - tags
      - status
      - verification_status
      - priority
      - test_results
      - depends_on
      - depended_by
      properties:
        external_id:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        priority:
          type: string
        test_results:
          type: array
          items:
            type: object
            required:
            - test_nodeid
            - last_status
            properties:
              test_nodeid:
                type: string
              last_status:
                type: string
        depends_on:
          type: array
          items:
            type: string
        depended_by:
          type: array
          items:
            type: string
        fret:
          type: object
          description: Present only when at least one FRET field is set; each key present only when set
          properties:
            scope:
              type: string
            condition:
              type: string
            component:
              type: string
            timing:
              type: string
            response:
              type: string
    SpecStatus:
      type: object
      required:
      - external_id
      - title
      - verification_status
      - last_checked
      - latest_result
      - regression
      properties:
        external_id:
          type: string
        title:
          type: string
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        last_checked:
          type: string
          format: date-time
          nullable: true
        latest_result:
          type: object
          nullable: true
          required:
          - status
          - message
          - checked_at
          - steps_passed
          - steps_failed
          properties:
            status:
              type: string
            message:
              type: string
            checked_at:
              type: string
              format: date-time
            steps_passed:
              type: integer
            steps_failed:
              type: integer
