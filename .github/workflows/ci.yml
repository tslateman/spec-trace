name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ./spectrace-flows -e ".[dev]"

      - name: Run tests
        run: python -m pytest -m "not demo" --tb=short -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        run: ruff check spectrace/ tests/ spectrace-flows/

      - name: Format (ruff format)
        run: ruff format --check spectrace/ tests/ spectrace-flows/
