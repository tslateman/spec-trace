name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ./spectrace-flows -e ".[dev]"

      - name: Run tests
        run: python -m pytest -m "not demo" --tb=short -q

  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spectrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spectrace

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ./spectrace-flows -e ".[dev]"

      - name: Run tests
        run: python -m pytest -m "not demo" --tb=short -q

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.15.4

      - name: Lint (ruff check)
        run: ruff check spectrace/ spectrace-flows/

      - name: Format (ruff format)
        run: ruff format --check spectrace/ spectrace-flows/

  changelog:
    name: Changelog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check CHANGELOG.md covers every commit
        run: python scripts/changelog.py check

  verification:
    name: Verification
    runs-on: ubuntu-latest

    # Pushes to main write the shared database; pull requests build a
    # throwaway SQLite file so a broken PR never touches it.
    env:
      DATABASE_URL: ${{ github.event_name == 'push' && secrets.SUPABASE_DATABASE_URL || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ./spectrace-flows -e ".[dev]"

      - name: Migrate the database
        run: python spectrace/manage.py migrate --no-input

      - name: Build the requirement database
        run: |
          python spectrace/manage.py parse_specs specs
          python spectrace/manage.py parse_specs meta/specs

      - name: Link tests to requirements
        run: |
          python spectrace/manage.py extract_links --path spectrace --output links.json
          python spectrace/manage.py import_test_links links.json

      - name: Check every requirement keeps its tests
        run: python spectrace/manage.py validate_links links.json --check-high-risk

  impact:
    name: Impact
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    # Writing the PR comment needs more than the read-only default above.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The analysis diffs the PR base against its head, so shallow fails.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ./spectrace-flows -e ".[dev]"

      # Affected tests come from the link database. Build it first, and let a
      # failure here fail the job rather than report an empty blast radius.
      - name: Build the requirement database
        run: |
          python spectrace/manage.py migrate --no-input
          python spectrace/manage.py parse_specs specs
          python spectrace/manage.py parse_specs meta/specs
          python spectrace/manage.py extract_links --path spectrace --output links.json
          python spectrace/manage.py import_test_links links.json

      # Informed-consent gate: exit 1 reports high or critical risk and must not
      # block the merge. Drop continue-on-error to make the gate blocking.
      - name: Analyze code impact
        id: analyze
        continue-on-error: true
        run: |
          python spectrace/manage.py code_impact_analysis \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            --format markdown \
            --output impact.md

      # continue-on-error hides a crash as well as a risk verdict. The marker
      # only reaches the report when the analysis finished, so grep tells the
      # two apart and a broken run never passes as "no impact".
      - name: Confirm the analysis finished
        run: |
          if ! grep -q '<!-- spectrace-impact-gate' impact.md; then
            echo "::error::Impact analysis did not finish (analyze step: ${{ steps.analyze.outcome }})"
            exit 1
          fi

      - name: Add the report to the job summary
        run: cat impact.md >> "$GITHUB_STEP_SUMMARY"

      # GITHUB_TOKEN is read-only on pull requests from forks, so posting there
      # would fail. The job summary above still carries the report.
      - name: Post the impact comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python spectrace/manage.py post_impact_comment --body-file impact.md
