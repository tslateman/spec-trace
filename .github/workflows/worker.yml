name: Worker

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "worker/**"
      - "plans/openapi-worker.yaml"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: worker

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Keep the JUnit report so the push job can link it
        uses: actions/upload-artifact@v7
        with:
          name: worker-junit
          path: worker/junit.xml

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply spectrace --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  push-specs:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          pip install uv
          uv pip install --system -e ./spectrace-flows -e ".[dev]"
      - run: |
          python spectrace/manage.py migrate --no-input
          python spectrace/manage.py parse_specs specs
          python spectrace/manage.py parse_specs meta/specs
          python spectrace/manage.py extract_links --path spectrace --output links.json
          python spectrace/manage.py import_test_links links.json
      - name: Fetch the Worker suite's JUnit report
        uses: actions/download-artifact@v8
        with:
          name: worker-junit
          path: worker
      - run: >
          spectrace push --specs specs --specs meta/specs --flows flows
          --links links.json --links worker/junit.xml --replace
        env:
          SPECTRACE_URL: ${{ secrets.SPECTRACE_URL }}
          SPECTRACE_API_KEY: ${{ secrets.SPECTRACE_API_KEY }}
      - name: Run the suite for its JUnit report
        continue-on-error: true
        run: python -m pytest -m "not demo" --tb=no -q --junitxml=test_results.xml
      - name: Push the results so coverage reflects them
        run: spectrace results push test_results.xml --links links.json
        env:
          SPECTRACE_URL: ${{ secrets.SPECTRACE_URL }}
          SPECTRACE_API_KEY: ${{ secrets.SPECTRACE_API_KEY }}
      - name: Push the Worker suite's results, linked by the tags in their names
        run: spectrace results push worker/junit.xml
        env:
          SPECTRACE_URL: ${{ secrets.SPECTRACE_URL }}
          SPECTRACE_API_KEY: ${{ secrets.SPECTRACE_API_KEY }}
      - name: Import the results so drift sees the latest run
        run: python spectrace/manage.py import_results test_results.xml --links links.json
      - name: Push the drift report the dashboard reads
        run: spectrace specs drift --tests spectrace --specs specs --push
        env:
          SPECTRACE_URL: ${{ secrets.SPECTRACE_URL }}
          SPECTRACE_API_KEY: ${{ secrets.SPECTRACE_API_KEY }}
      - name: Push the impact report for what this push changed
        if: github.event.before != '0000000000000000000000000000000000000000'
        run: spectrace specs impact "$BEFORE" "$GITHUB_SHA" --spec-dir specs --push
        env:
          BEFORE: ${{ github.event.before }}
          SPECTRACE_URL: ${{ secrets.SPECTRACE_URL }}
          SPECTRACE_API_KEY: ${{ secrets.SPECTRACE_API_KEY }}
