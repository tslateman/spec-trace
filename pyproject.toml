[project]
name = "spectrace"
version = "0.1.0"
description = "Requirements traceability system connecting specs to verified tests"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "SpecTrace Team" }
]

dependencies = [
    "Django>=5.2,<5.3",
    "django-treebeard>=4.8,<5.0",
    "python-frontmatter>=1.1,<2.0",
    "Markdown>=3.7,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-django>=4.11,<5.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["spectrace*", "requirements*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "spectrace.settings"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["spectrace"]
