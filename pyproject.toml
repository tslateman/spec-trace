[project]
name = "spectrace"
version = "0.1.0"
description = "Requirements traceability system connecting specs to verified tests"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "SpecTrace Team" }
]

dependencies = [
    "Django>=5.2,<5.3",
    "django-treebeard>=4.8,<5.0",
    "django-ratelimit>=4.1,<5.0",
    "python-frontmatter>=1.1,<2.0",
    "Markdown>=3.7,<4.0",
    "junitparser>=4.0,<5.0",
    "django-unfold>=0.76,<1.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.32,<3.0",
    "msgspec>=0.19.0",
    "ruamel-yaml>=0.19.1",
    "spectrace-flows",
    "click>=8.1,<9.0",
]

[project.scripts]
spectrace = "spectrace.cli:main"

[project.optional-dependencies]
github = [
    "PyJWT>=2.8,<3.0",
    "cryptography>=42.0,<44.0",
]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-django>=4.11,<5.0",
    "freezegun>=1.4,<2.0",
    "responses>=0.25,<1.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["spectrace*", "requirements*"]

[tool.ruff]
target-version = "py312"
src = ["spectrace", "spectrace-flows"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]
"*/examples/*.py" = ["E501", "W293"]
"spectrace/requirements/api.py" = ["E402"]
"spectrace/verify_phase1.py" = ["E402"]
"scripts/demo.py" = ["E402"]
"scripts/demo_pipeline.py" = ["E402"]
"scripts/setup.py" = ["E402"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "spectrace.settings"
testpaths = ["spectrace", "spectrace-flows/tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["spectrace"]
addopts = ["--import-mode=importlib"]
markers = [
    "requirement(*req_ids, reason=None): link test to requirement IDs",
    "linear(*issue_ids): link test to Linear issue IDs (e.g., CAN-1234)",
    "demo: intentionally failing tests for dashboard demo data",
]
