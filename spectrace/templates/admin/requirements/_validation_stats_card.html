<!-- Validation Run Summary Stats Card -->
<!-- Note: Requires _design_system.html to be included in the parent template -->
<div class="st-grid-stats mb-6">
    <div class="st-metric st-metric--accent st-lift">
        <div class="st-metric__label">Total Runs</div>
        <div class="st-metric__value">{{ summary.total_runs }}</div>
    </div>
    <div class="st-metric {% if summary.avg_pass_rate >= 90 %}st-metric--pass{% elif summary.avg_pass_rate >= 70 %}st-metric--warn{% else %}st-metric--fail{% endif %} st-lift">
        <div class="st-metric__label">Avg Pass Rate</div>
        <div class="st-metric__value" style="{% if summary.avg_pass_rate >= 90 %}color: var(--st-pass);{% elif summary.avg_pass_rate >= 70 %}color: var(--st-warn);{% else %}color: var(--st-fail);{% endif %}">
            {{ summary.avg_pass_rate }}%
        </div>
    </div>
    <div class="st-metric st-metric--fail st-lift">
        <div class="st-metric__label">Recent Failures (7d)</div>
        <div class="st-metric__value" style="color: var(--st-fail);">{{ summary.recent_failures }}</div>
    </div>
    <div class="st-metric st-lift">
        <div class="st-metric__label">Vendors</div>
        <div class="st-metric__value">{{ summary.unique_vendors }}</div>
    </div>
</div>
